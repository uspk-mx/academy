# Local-only toolchain. Runs the monorepo's bun commands inside a container so
# install / build / typecheck / format behave the same on every machine — no
# local bun/Node install required. NOT for deployment (that's Vercel).
#
# Usage (see the Makefile for shortcuts):
#   docker compose run --rm app bun install
#   docker compose run --rm app bun run build
#   docker compose run --rm app bun run typecheck
#   docker compose up dev            # both apps with HMR (web :5173, student :5174)
#
# The container keeps its OWN linux node_modules in named volumes, so your Mac's
# node_modules never leak in (and vice versa). Run `bun install` once to fill it.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app # live source
      - academy_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - student_node_modules:/app/apps/student/node_modules
    environment:
      - NODE_ENV=development

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: bun run dev
    ports:
      - "5173:5173" # web
      - "5174:5174" # student
    volumes:
      - .:/app
      - academy_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - student_node_modules:/app/apps/student/node_modules
    # Reach the host-native Go API from inside the container (SSR only; the
    # browser still hits VITE_API_URL=localhost since it runs on the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - DOCKER_DEV=1
      - CHOKIDAR_USEPOLLING=true
      - API_URL=http://host.docker.internal:4000/query

volumes:
  academy_node_modules:
  web_node_modules:
  student_node_modules:
